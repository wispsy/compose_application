[project]
name = "compose-application"
version = "0.1.0a1"
description = "Optional composition of typed storage, APIs and spatial interfaces."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
authors = [{ name = "ellainng" }]
dependencies = []

[project.optional-dependencies]
validation = ["expose-api[backpack,enforce-type]==0.2.0"]
service = ["expose-api[backpack]==0.2.0"]
ui = [
    "expose-api[backpack]==0.2.0",
    "spatial-ui==0.1.1",
]
live = [
    "expose-api[backpack]==0.2.0",
    "spatial-ui==0.1.1",
]

tabular = [
    "expose-api[backpack]==0.2.0",
    "spatial-ui==0.1.1",
    "headless-spreadsheets==0.1.1",
]

[project.urls]
Source = "https://github.com/wispsy/compose_application"
Issues = "https://github.com/wispsy/compose_application/issues"
Project = "https://github.com/orgs/wispsy/projects/18"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
browser-tests = ["playwright==1.64.0"]

[tool.uv]
conflicts = [
    [{ extra = "validation" }, { extra = "service" }],
    [{ extra = "validation" }, { extra = "ui" }],
    [{ extra = "validation" }, { extra = "live" }],
    [{ extra = "tabular" }, { extra = "validation" }],
    [{ extra = "tabular" }, { extra = "service" }],
    [{ extra = "tabular" }, { extra = "ui" }],
    [{ extra = "tabular" }, { extra = "live" }],
]
