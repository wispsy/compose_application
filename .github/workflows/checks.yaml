name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: macOS hosted runner
        type: choice
        required: true
        default: macos-15-intel
        options: [macos-15-intel, macos-latest]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: Installed distributions (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, "${{ inputs.macos_runner || 'macos-15-intel' }}", windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: '0.13.6'
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run --locked python scripts/check_contracts.py
      - run: uv run --locked python -m scripts.check_tabular
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked python scripts/probe_track_b.py
      - run: uv run --locked python scripts/check_distribution.py --matrix --ui --live --projects --validation --tabular --report compatibility.json
      - name: Retain exact compatibility receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.os }}
          path: compatibility.json
          if-no-files-found: error

  live-profile:
    name: Protected native live profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: '0.13.6'
          python-version: '3.14'
      - run: uv sync --locked --extra live
      - run: uv run --frozen python -W error::ResourceWarning scripts/check_live_profile.py --receipt live-profile.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-profile
          path: live-profile.json
          if-no-files-found: error

  ui-browser:
    name: Persistent UI / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: '0.13.6'
          python-version: '3.14'
      - run: uv sync --locked --extra ui --group browser-tests
      - run: uv run --locked --extra ui --group browser-tests python -m playwright install --with-deps chromium
      - run: uv run --locked --extra ui --group browser-tests python -m unittest discover -s tests -p browser_ui.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-browser-receipt
          path: ui-browser-receipt.json
          if-no-files-found: error

  live-browser:
    name: Protected live reference / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: '0.13.6'
          python-version: '3.14'
      - run: uv sync --locked --extra live --group browser-tests
      - run: uv run --frozen python -m playwright install --with-deps chromium
      - run: uv run --frozen python -W error::ResourceWarning -m unittest discover -s tests -p browser_live_reference.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-reference-browser
          path: live-reference-browser-receipt.json
          if-no-files-found: error

  track-b-probes:
    name: Track B prerequisite probes (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: '0.13.6'
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: wispsy/pocket-python
          ref: 5072ae1b11c24bae219a73c35caa30c5406194d4
          path: .dependencies/pocket-python
          persist-credentials: false
      - run: uv sync --locked
      - run: uv run --locked python scripts/probe_track_b.py --runtime .dependencies/pocket-python

  tabular-browser:
    name: Persisted read-only and editable tables / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: '0.13.6'
          python-version: '3.14'
      - run: uv sync --locked --extra tabular --group browser-tests
      - run: uv run --frozen python -m playwright install --with-deps chromium
      - run: uv run --frozen python -W error::ResourceWarning scripts/check_distribution.py --tabular --tabular-browser --report tabular-installed-browser.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tabular-browser
          path: tabular-installed-browser.json
          if-no-files-found: error
